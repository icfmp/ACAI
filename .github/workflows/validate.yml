name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test exact original-language group validator
        run: python3 -I .github/scripts/test_validate_duplicate_groups.py
      - name: Validate records
        run: python3 -I .github/scripts/validate.py
      - name: Validate retired entity-ID migrations
        run: |
          python3 -I .github/scripts/audit_entity_links.py \
            --targets-file .github/deprecated-entity-ids.txt \
            --fail-any
